[tool.poetry]
name = "schem-generator-tmb"
version = "0.1.0"
description = "Local Minecraft schematic generator platform"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
python-multipart = "^0.0.9"
nbtlib = "^2.0.0"
rich = "^13.7.0"
SQLAlchemy = "^2.0.0"
Jinja2 = "^3.1.0"
httpx = "^0.26.0"
numpy = "^1.26.0"
torch = {version = "^2.1.0", optional = true}

[tool.poetry.extras]
training = ["torch"]

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
